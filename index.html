<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Language Translator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:#fff;border-radius:24px;padding:40px;max-width:600px;width:100%}
h1{color:#667eea;font-size:24px}
.price{background:#667eea;color:#fff;padding:10px 20px;border-radius:30px;display:inline-block;font-weight:bold;margin:20px 0}
.form-group{margin-bottom:18px}
label{display:block;margin-bottom:8px;color:#333;font-weight:600}
textarea,select{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:16px}
textarea{min-height:80px}
button{width:100%;padding:18px;background:#667eea;color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
.result{margin-top:30px;padding:24px;background:#f0f0f0;border-radius:16px;display:none}
.result.show{display:block}
</style>
</head>
<body>
<div class="container">
<h1>🌐 Multi-Language Translator</h1>
<p>Translate your product listings</p>
<div class="price">💰 $0.49 USDT</div>
<div class="form-group"><label>Text</label><textarea id="text" placeholder="Enter text..."></textarea></div>
<div class="form-group"><label>From</label><select id="from"><option value="en">English</option><option value="zh">Chinese</option><option value="ja">Japanese</option></select></div>
<div class="form-group"><label>To</label><select id="to"><option value="zh">Chinese</option><option value="en">English</option><option value="ja">Japanese</option><option value="ko">Korean</option></select></div>
<button onclick="translate()">Translate - $0.49</button>
<div class="result" id="result">
<h3>🌍 Result</h3>
<p id="output"></p>
</div>
</div>
<script>
function translate(){
var text=document.getElementById('text').value;
var from=document.getElementById('from').value;
var to=document.getElementById('to').value;
if(!text){alert('Enter text!');return;}
document.getElementById('output').innerHTML='<strong>'+from+' → '+to+':</strong><br>【'+text+'】';
document.getElementById('result').className='result show';
}
</script>
</body>
</html>
