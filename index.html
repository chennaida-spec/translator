<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>
<style>
body{font-family:-apple-system;background:#667eea;padding:20px;margin:0}
.container{background:#fff;border-radius:20px;padding:30px;max-width:500px;margin:0 auto}
h1{color:#333;margin:0 0 10px}
input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#result{padding:20px;background:#f5f5f5;border-radius:10px;margin-top:20px;display:none}
#result.show{display:block}
</style>
</head>
<body>
<div class="container">
<h1>Translator</h1>
<p>Enter text to translate</p>
<input type="text" id="text" placeholder="Hello">
<select id="from"><option value="en">English</option><option value="zh">Chinese</option></select>
<select id="to"><option value="zh">Chinese</option><option value="en">English</option></select>
<button onclick="translate()">Translate</button>
<div id="result">
<h3>Result:</h3>
<p id="output"></p>
</div>
</div>
<script>
function translate(){
var t=document.getElementById('text').value;
var f=document.getElementById('from').value;
var o=document.getElementById('to').value;
if(!t){alert('Enter text');return;}
document.getElementById('output').innerText=t+' -> '+o;
document.getElementById('result').className='show';
}
</script>
</body>
</html>
